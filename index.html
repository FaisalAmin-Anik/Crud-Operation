<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Crud operation</title>
</head>

<body>
    <div class="container">
        <div class="mb-3">
            <label for="exampleFormControlInput1" class="form-label">Enter Your Name</label>
            <input type="text" class="form-control name" id="exampleFormControlInput1" placeholder="Enter Your Name">
        </div>
        <h4 class="nameerror" style="color: red;"></h4>
        <div class="mb-3">
            <label for="exampleFormControlTextarea1" class="form-label">Enter Caption</label>
            <textarea class="form-control caption" id="exampleFormControlTextarea1" rows="3" placeholder="Caption"></textarea>
        </div>
        <h4 class="captionerror" style="color: red;"></h4>
        <input type="file" class="myFile" style="display: block; margin: 10px 0px;">
        <button type="button" class="btn btn-primary post">Post</button>
        <button type="button" class="btn btn-primary update" style="display: none;">Update</button>


        <div class="allpost d-flex flex-wrap column-gap-3">

        </div>



    </div>







    <script src="./js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
